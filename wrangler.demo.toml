# Local dev Wrangler config for the basgr.com demo. Used by `npm run dev:demo`.
# Origin: scripts/dev-origin.ts on :8082 serving demo/site.
# Worker:  http://localhost:8788.

name               = "cf-webmcp-demo"
main               = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8788

[[r2_buckets]]
binding     = "CF_WEBMCP_ASSETS"
bucket_name = "cf-webmcp-demo-assets"
