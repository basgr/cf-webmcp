# Copy this file to wrangler.toml and edit the values for your deployment.
# Build pipeline runs scripts/build-config.ts before deploy via the `build` field.

name         = "cf-webmcp"
main         = "src/worker.ts"
compatibility_date = "2026-06-25"
compatibility_flags = ["nodejs_compat"]

# Route the entire domain through the Worker (full proxy mode).
# For route-only mode, replace with specific patterns: see docs/deployment.md.
#
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" }
# ]

# Build pipeline. Compiles webmcp.toml → src/generated/*.
[build]
command = "npm run build"

# Worker bundle uploads generated/* alongside src/*.
[[rules]]
type    = "ESModule"
globs   = ["**/*.js"]
fallthrough = false

# R2 bucket for the vendored fallback widget. Optional if fallback_widget = false.
[[r2_buckets]]
binding     = "CF_WEBMCP_ASSETS"
bucket_name = "cf-webmcp-assets"

# Analytics Engine for /_webmcp/health metrics. Optional.
# [[analytics_engine_datasets]]
# binding = "WEBMCP_METRICS"

# Cache API binding is implicit on Workers.

# Secrets (set via `wrangler secret put`):
#   CF_WEBMCP_DEPLOY_TOKEN   sent as cf-webmcp-bypass and cf-webmcp-deploy-token headers on the Worker's own
#                            fetches to origin (preflight sends them too), so your origin's WAF or Bot
#                            Management can allow-list that traffic. The Worker does not read these headers
#                            itself: there is no bypass mode.
#   CF_WEBMCP_HEALTH_TOKEN   bearer token for /_webmcp/health. When set it replaces [health].token, and with
#                            [health].public = false it makes the endpoint authenticated instead of a 404.
